<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blue Jay</title>

  <link rel="stylesheet" href="../static/styles.css">

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    rel="stylesheet"
  >
</head>

<body>
  <div class="container">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>
          <i class="fas fa-feather-alt"></i>
          Blue Jay
        </h2>
      </div>

      <nav class="sidebar-nav">
        <ul>
          <li>
            <a
              href="#inicio"
              class="nav-link active"
              data-section="inicio"
            >
              <i class="fas fa-home"></i>
              <span>Inicio</span>
            </a>
          </li>

          <li>
            <a
              href="#profile"
              class="nav-link"
              data-section="profile"
            >
              <i class="fas fa-user"></i>
              <span>Mi Perfil</span>
            </a>
          </li>

          <li>
            <a
              href="#search"
              class="nav-link"
              data-section="search"
            >
              <i class="fas fa-search"></i>
              <span>Buscar</span>
            </a>
          </li>

          <li>
            <a
              href="#requests"
              class="nav-link"
              data-section="requests"
            >
              <i class="fas fa-user-clock"></i>
              <span>Solicitudes</span>
            </a>
          </li>

          <li>
            <a
              href="#settings"
              class="nav-link"
              data-section="settings"
            >
              <i class="fas fa-cog"></i>
              <span>Configuración</span>
            </a>
          </li>

          <li>
            <a
              href="#logout"
              class="nav-link logout"
              data-section="logout"
            >
              <i class="fas fa-sign-out-alt"></i>
              <span>Salir</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">

      <header class="content-header">
        <h1 id="page-title">
          Bienvenido a Blue Jay
        </h1>

        <p id="page-subtitle">
          Explora el contenido y disfruta de la experiencia
        </p>
      </header>

      <section id="composer" class="card composer">
        <form id="post-form">

          <label for="post-content">
            ¿Qué está pasando?
          </label>

          <textarea
            id="post-content"
            rows="3"
            maxlength="500"
            placeholder="Comparte algo con tu comunidad..."
            required
          ></textarea>

          <div class="composer-footer">
            <small id="char-count">0/500</small>

            <button
              class="primary-btn"
              type="submit"
            >
              <i class="fas fa-feather-alt"></i>
              Publicar
            </button>
          </div>

        </form>
      </section>

      <section
        id="view-content"
        aria-live="polite"
      ></section>

    </main>
  </div>

  <button
    class="mobile-menu-toggle"
    id="mobileToggle"
    aria-label="Abrir menú"
  >
    <i class="fas fa-bars"></i>
  </button>

  <div
    id="notifications"
    class="notifications"
    aria-live="polite"
  ></div>

  <script
    type="module"
    src="../static/script.js"
  ></script>
</body>
</html>
